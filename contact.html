<main id="main-content"><section class="content-section contact-section" aria-labelledby="contact-heading"><h1 id="contact-heading">Get In Touch</h1><p>Have a question or want to connect? Try the contact form below.</p><form id="contact-form" class="contact-form" novalidate><div class="form-group"><label for="full-name">Full Name <span aria-hidden="true">*</span></label><input id="full-name" name="full-name" type="text" autocomplete="name" required aria-describedby="name-error"><p class="field-error" id="name-error"></p></div><div class="form-group"><label for="email">Email Address <span aria-hidden="true">*</span></label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error"><p class="field-error" id="email-error"></p></div><div class="form-group"><label for="message">Message <span aria-hidden="true">*</span></label><textarea id="message" name="message" rows="5" required aria-describedby="message-error"></textarea><p class="field-error" id="message-error"></p></div><button class="button" type="submit">Check message</button><p id="form-status" role="status" aria-live="polite"></p></form></section></main>
